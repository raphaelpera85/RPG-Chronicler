[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-chronicler"
version = "0.1.0"
description = "Gravador, transcritor, diarizador e cronista de sessões de RPG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2,<2",
  "numpy>=2,<3",
  "openai>=2,<4",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "sounddevice>=0.5,<1",
]

[project.scripts]
rpg-chronicler = "rpg_chronicler:main"

[tool.setuptools]
py-modules = ["rpg_chronicler", "rpg_chronicler_core"]
